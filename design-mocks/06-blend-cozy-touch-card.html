<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blend: Cozy base + touch of card-game</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: #f5f0e8;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #3d3630;
    }
    .mock {
      text-align: center;
      max-width: 28rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      color: #4a4038;
      margin: 0 0 0.75rem;
      letter-spacing: -0.01em;
    }
    .tagline {
      font-size: 0.9375rem;
      line-height: 1.55;
      color: #6b5f54;
      margin: 0 0 1.5rem;
    }
    /* Touch of 1: gold button instead of green */
    .btn {
      display: inline-block;
      padding: 0.625rem 1.5rem;
      font-size: 1rem;
      font-family: inherit;
      font-weight: 600;
      color: #1a1510;
      background: linear-gradient(180deg, #d4af37 0%, #b8960e 100%);
      border: 2px solid #8b6914;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(184, 150, 14, 0.35);
      margin-bottom: 1.5rem;
    }
    /* Touch of 1: card frame — border + inner glow, heading in gold/serif */
    .card {
      position: relative;
      background: #fff;
      border-radius: 14px;
      padding: 1.5rem;
      text-align: left;
      box-shadow: 0 4px 20px rgba(61, 54, 48, 0.08);
      border: 2px solid #d4c4a0;
    }
    .card::before {
      content: "";
      position: absolute;
      top: 6px; left: 6px; right: 6px; bottom: 6px;
      border: 1px solid rgba(184, 150, 14, 0.15);
      border-radius: 10px;
      pointer-events: none;
    }
    .card-intro {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #8b7d6f;
      margin: 0 0 0.35rem;
    }
    .card-heading {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: #9a7b2e;
      margin: 0 0 0.75rem;
    }
    .card-list {
      margin: 0;
      padding-left: 1.25rem;
      color: #5c5248;
      font-size: 0.9375rem;
      line-height: 1.65;
    }
    .footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #9c9084;
    }
  </style>
</head>
<body>
  <div class="mock">
    <h1>What are we brewing?</h1>
    <p class="tagline">Roll the dice—get random Commander constraints. Color, theme, budget, and more.<br>Your next deck starts here.</p>
    <button type="button" class="btn">Roll the dice</button>
    <div class="card">
      <p class="card-intro">Your build brief:</p>
      <p class="card-heading">Build a Sultai (UBG) Commander deck</p>
      <ul class="card-list">
        <li>Budget: Under $50</li>
        <li>Theme: Reanimator / graveyard</li>
      </ul>
    </div>
    <p class="footer">0.1.0 · abc1234</p>
  </div>
</body>
</html>
