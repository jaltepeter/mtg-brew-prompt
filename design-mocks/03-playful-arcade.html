<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mock 3: Playful / arcade</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: linear-gradient(160deg, #2d1b69 0%, #1a0a3e 100%);
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #fff;
    }
    .mock {
      text-align: center;
      max-width: 26rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin: 0 0 0.75rem;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-shadow: 0 2px 0 rgba(0,0,0,0.3);
    }
    .tagline {
      font-size: 0.9375rem;
      line-height: 1.5;
      color: #c4b8ff;
      margin: 0 0 1.5rem;
    }
    .btn {
      display: inline-block;
      padding: 1rem 2rem;
      font-size: 1.25rem;
      font-family: inherit;
      font-weight: 700;
      color: #2d1b69;
      background: #ffd93d;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 0 #c4a020, 0 8px 20px rgba(0,0,0,0.3);
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .card {
      background: rgba(255,255,255,0.12);
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 20px;
      padding: 1.5rem;
      text-align: left;
      backdrop-filter: blur(8px);
    }
    .card-intro {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #a89be8;
      margin: 0 0 0.5rem;
    }
    .card-heading {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      margin: 0 0 0.75rem;
    }
    .card-list {
      margin: 0;
      padding-left: 1.25rem;
      color: #e0d8ff;
      font-size: 0.9375rem;
      line-height: 1.7;
    }
    .footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #8b7cc4;
    }
  </style>
</head>
<body>
  <div class="mock">
    <h1>What are we brewing?</h1>
    <p class="tagline">Roll the dice—get random Commander constraints. Color, theme, budget, and more.<br>Your next deck starts here.</p>
    <button type="button" class="btn">Roll the dice</button>
    <div class="card">
      <p class="card-intro">Your build brief:</p>
      <p class="card-heading">Build a Sultai (UBG) Commander deck</p>
      <ul class="card-list">
        <li>Budget: Under $50</li>
        <li>Theme: Reanimator / graveyard</li>
      </ul>
    </div>
    <p class="footer">0.1.0 · abc1234</p>
  </div>
</body>
</html>
