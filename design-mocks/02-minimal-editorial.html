<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mock 2: Minimal / editorial</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem;
      background: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      color: #111;
    }
    .mock {
      text-align: center;
      max-width: 36rem;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: -0.03em;
      margin: 0 0 1.5rem;
      color: #111;
    }
    .tagline {
      font-size: 1rem;
      line-height: 1.6;
      color: #444;
      margin: 0 0 2.5rem;
      max-width: 32ch;
      margin-left: auto;
      margin-right: auto;
    }
    .btn {
      display: inline-block;
      padding: 0.5rem 0;
      font-size: 0.875rem;
      font-family: inherit;
      font-weight: 500;
      color: #111;
      background: none;
      border: none;
      border-bottom: 1px solid #111;
      cursor: pointer;
      margin-bottom: 3rem;
      letter-spacing: 0.02em;
    }
    .result {
      text-align: left;
      border-top: 1px solid #ddd;
      padding-top: 2rem;
      max-width: 28rem;
      margin: 0 auto;
    }
    .result-intro {
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #888;
      margin: 0 0 0.5rem;
    }
    .result-heading {
      font-size: 1.25rem;
      font-weight: 500;
      margin: 0 0 1rem;
      color: #111;
    }
    .result-list {
      margin: 0;
      padding-left: 1.25rem;
      font-size: 0.9375rem;
      line-height: 1.8;
      color: #333;
    }
    .footer {
      margin-top: 3rem;
      font-size: 0.75rem;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="mock">
    <h1>What are we brewing?</h1>
    <p class="tagline">Roll the dice—get random Commander constraints. Color, theme, budget, and more.<br>Your next deck starts here.</p>
    <button type="button" class="btn">Roll the dice</button>
    <div class="result">
      <p class="result-intro">Your build brief:</p>
      <p class="result-heading">Build a Sultai (UBG) Commander deck</p>
      <ul class="result-list">
        <li>Budget: Under $50</li>
        <li>Theme: Reanimator / graveyard</li>
      </ul>
    </div>
    <p class="footer">0.1.0 · abc1234</p>
  </div>
</body>
</html>
